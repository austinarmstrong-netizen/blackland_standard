<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackland Standard - Pricing Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            padding: 16px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 16px;
        }
        
        header h1 {
            font-size: 28px;
            color: #2c2c2c;
            margin-bottom: 4px;
            font-weight: 600;
        }
        
        header p {
            font-size: 14px;
            color: #666;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        
        .card h2 {
            font-size: 18px;
            color: #2c2c2c;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .currency {
            font-size: 14px;
            color: #999;
            font-weight: 500;
        }
        
        input[type="number"],
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        input[type="number"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #333;
            box-shadow: 0 0 0 3px rgba(51, 51, 51, 0.1);
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        
        .margin-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .margin-btn {
            padding: 10px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
        }
        
        .margin-btn:hover {
            border-color: #333;
            background: #f9f9f9;
        }
        
        .margin-btn.active {
            background: #2c2c2c;
            color: white;
            border-color: #2c2c2c;
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        
        .result-card {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        
        .result-card.highlight {
            background: #2c2c2c;
            border-color: #2c2c2c;
            color: white;
        }
        
        .result-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        .result-card.highlight .result-label {
            color: #ccc;
        }
        
        .result-value {
            font-size: 24px;
            font-weight: 600;
            color: #2c2c2c;
        }
        
        .result-card.highlight .result-value {
            color: white;
        }
        
        .custom-margin {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .custom-margin label {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            display: block;
            font-weight: 500;
        }
        
        .custom-input-group {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .custom-input-group input {
            flex: 1;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .custom-input-group input:focus {
            outline: none;
            border-color: #333;
            box-shadow: 0 0 0 3px rgba(51, 51, 51, 0.1);
        }
        
        .custom-result {
            margin-top: 16px;
            padding: 16px;
            background: #f0f8f0;
            border: 1px solid #d0e8d0;
            border-radius: 8px;
            text-align: center;
        }
        
        .custom-result-label {
            font-size: 12px;
            color: #4a7c4a;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        .custom-result-value {
            font-size: 28px;
            font-weight: 600;
            color: #2c6e2c;
        }
        
        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0086b3;
            padding: 16px;
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .info-box p {
            font-size: 13px;
            color: #0086b3;
            line-height: 1.6;
        }
        
        .reset-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        
        .reset-btn:hover {
            background: #e0e0e0;
            border-color: #999;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Blackland Standard</h1>
            <p>Pricing Calculator</p>
        </header>
        
        <div class="card">
            <h2>Hard Costs</h2>
            <div class="grid-2">
                <div class="input-group">
                    <label for="materials">Materials Cost</label>
                    <div class="input-wrapper">
                        <span class="currency">$</span>
                        <input type="number" id="materials" value="2.82" step="0.01" min="0">
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="labor">Labor Cost</label>
                    <div class="input-wrapper">
                        <span class="currency">$</span>
                        <input type="number" id="labor" value="6.67" step="0.01" min="0">
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="other">Other Costs (depreciation, supplies, etc.)</label>
                    <div class="input-wrapper">
                        <span class="currency">$</span>
                        <input type="number" id="other" value="0" step="0.01" min="0">
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="productName">Product Name (optional)</label>
                    <input type="text" id="productName" placeholder="e.g., Boot Bows">
                </div>
            </div>
            
            <div class="info-box">
                <p><strong>Total Hard Cost: $<span id="totalCost">9.49</span></strong></p>
            </div>
        </div>
        
        <div class="card">
            <h2>Pricing by Margin Target</h2>
            
            <label style="display: block; font-size: 13px; color: #666; margin-bottom: 12px; font-weight: 500;">Quick targets:</label>
            <div class="margin-selector">
                <button class="margin-btn" onclick="calculateMargin(30)">30%</button>
                <button class="margin-btn" onclick="calculateMargin(35)">35%</button>
                <button class="margin-btn active" onclick="calculateMargin(40)">40%</button>
                <button class="margin-btn" onclick="calculateMargin(45)">45%</button>
                <button class="margin-btn" onclick="calculateMargin(50)">50%</button>
            </div>
            
            <div id="standardResults" class="results"></div>
            
            <div class="custom-margin">
                <label for="customMargin">Custom Margin %</label>
                <div class="custom-input-group">
                    <input type="number" id="customMargin" value="40" step="1" min="0" max="100" placeholder="Enter margin %">
                    <button onclick="calculateCustomMargin()" style="padding: 10px 24px; background: #2c2c2c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px;">Calculate</button>
                </div>
                <div id="customResult" class="custom-result" style="display: none;">
                    <div class="custom-result-label" id="customLabel">40% Margin</div>
                    <div class="custom-result-value" id="customPrice">$15.82</div>
                </div>
            </div>
        </div>
        
        <button class="reset-btn" onclick="resetCalculator()">Reset to Defaults</button>
        
        <footer>
            <p>Blackland Standard Pricing Calculator | Save this page for offline use</p>
        </footer>
    </div>
    
    <script>
        function updateCalculations() {
            const materials = parseFloat(document.getElementById('materials').value) || 0;
            const labor = parseFloat(document.getElementById('labor').value) || 0;
            const other = parseFloat(document.getElementById('other').value) || 0;
            const totalCost = materials + labor + other;
            
            document.getElementById('totalCost').textContent = totalCost.toFixed(2);
            
            renderStandardResults(totalCost);
        }
        
        function renderStandardResults(cost) {
            const margins = [30, 35, 40, 45, 50];
            const resultsDiv = document.getElementById('standardResults');
            resultsDiv.innerHTML = '';
            
            margins.forEach(margin => {
                const sellingPrice = cost / (1 - margin / 100);
                const profit = sellingPrice - cost;
                
                const card = document.createElement('div');
                card.className = 'result-card' + (margin === 40 ? ' highlight' : '');
                card.innerHTML = `
                    <div class="result-label">${margin}% Margin</div>
                    <div class="result-value">$${sellingPrice.toFixed(2)}</div>
                    <div style="font-size: 12px; color: #999; margin-top: 4px;">profit: $${profit.toFixed(2)}</div>
                `;
                resultsDiv.appendChild(card);
            });
        }
        
        function calculateMargin(margin) {
            const materials = parseFloat(document.getElementById('materials').value) || 0;
            const labor = parseFloat(document.getElementById('labor').value) || 0;
            const other = parseFloat(document.getElementById('other').value) || 0;
            const totalCost = materials + labor + other;
            
            document.querySelectorAll('.margin-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('customMargin').value = margin;
            calculateCustomMargin();
        }
        
        function calculateCustomMargin() {
            const materials = parseFloat(document.getElementById('materials').value) || 0;
            const labor = parseFloat(document.getElementById('labor').value) || 0;
            const other = parseFloat(document.getElementById('other').value) || 0;
            const totalCost = materials + labor + other;
            const margin = parseFloat(document.getElementById('customMargin').value) || 0;
            
            if (margin >= 100) {
                document.getElementById('customResult').style.display = 'none';
                return;
            }
            
            const sellingPrice = totalCost / (1 - margin / 100);
            const profit = sellingPrice - totalCost;
            
            document.getElementById('customLabel').textContent = margin + '% Margin';
            document.getElementById('customPrice').textContent = '$' + sellingPrice.toFixed(2);
            document.getElementById('customResult').style.display = 'block';
            
            // Show profit breakdown
            const profitDisplay = document.createElement('div');
            profitDisplay.style.cssText = 'margin-top: 12px; font-size: 12px; color: #666;';
            profitDisplay.innerHTML = `Selling Price: $${sellingPrice.toFixed(2)} | Profit: $${profit.toFixed(2)}`;
            
            const existing = document.getElementById('customResult').querySelector('div:last-child');
            if (existing && existing.style.marginTop === '12px') {
                existing.remove();
            }
            
            document.getElementById('customResult').appendChild(profitDisplay);
        }
        
        function resetCalculator() {
            document.getElementById('materials').value = '2.82';
            document.getElementById('labor').value = '6.67';
            document.getElementById('other').value = '0';
            document.getElementById('productName').value = '';
            document.getElementById('customMargin').value = '40';
            
            document.querySelectorAll('.margin-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.margin-btn')[2].classList.add('active');
            
            updateCalculations();
            calculateCustomMargin();
        }
        
        // Event listeners
        document.getElementById('materials').addEventListener('input', updateCalculations);
        document.getElementById('labor').addEventListener('input', updateCalculations);
        document.getElementById('other').addEventListener('input', updateCalculations);
        document.getElementById('customMargin').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') calculateCustomMargin();
        });
        
        // Initialize
        updateCalculations();
    </script>
</body>
</html>
